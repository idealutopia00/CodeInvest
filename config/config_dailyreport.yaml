# --- 市场数据配置 ---
market:
  # 1. 核心指数：用于判断大盘方向
  indices:
    - code: "sz.399317" 
      name: "国证A股指数"
      ps: "选取在深圳、上海证券交易所上市的除ST、*ST股票外的所有A股组成样本股,反映中国证券A股市场股票价格的总体变动趋势。"

    - code: "sh.000852" 
      name: "中证1000指数"
      ps: "选择中证800指数样本股之外规模偏小且流动性好的1000只股票组成指数样本,与沪深300和中证500等指数形成互补。"

    - code: "sh.000001"
      name: "上证综合指数"
      ps: "以上交所挂牌上市的全部股票作为样本股，从总体上反映了上交所上市股票价格的变动情况。"

    - code: "sz.399001"
      name: "深证成份指数(价格)"
      ps: "选择在深交所上市交易且满足入围标准的A股作为样本空间,选取一段时期(前6个月)平均总市值的比重、平均自由流通市值的比重和平均成交金额的比重综合排名在前500名的A股构成初始样本股。"

    - code: "sh.000300" 
      name: "沪深300指数"
      ps: "从样本空间股票中选择最近一年(新股为上市以来)日均成交金额排名前50%的A股股票,选取日均总市值取排名在前的300只股票作为样本股。"

    - code: "sz.399006"
      name: "创业板指数P"
      ps: "从创业板股票中选取100只最具代表性的100只股票组成样本股,反映创业板市场层次的运行情况。"

  # 2. 宏观数据开关
  macro:
    enable: true
    lookback_days: 365 # 宏观数据更新慢，需要往前多查几天

  # 3. 重点观察个股（风向标）
  focus_stocks:
    - "sh.600519" # 贵州茅台 (白酒/消费龙头)
    - "sz.300750" # 宁德时代 (新能源龙头)
    - "sh.601318" # 中国平安 (金融龙头)
    - "sh.601138" # 工业富联 (AI算力/科技)
    - "sz.002475" # 立讯精密 (消费电子/科技)

# --- 全市场核心板块锚点 (覆盖：周期/金融/科技/消费/制造) ---
