      code: "sh.515700" # 电池/整车
    - name: "光伏产业"
      code: "sh.515790" # 光伏/储能
    - name: "国防军工"
      code: "sh.512660" # 央国企/地缘政治

    # === 周期/资源 (通胀与复苏) ===
